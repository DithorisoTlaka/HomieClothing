<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Status — KasiStay</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #111;
  --muted: #666;
  --primary: #14b8a6;
  --shadow: 0 10px 30px rgba(0,0,0,0.12);
  --border: rgba(0,0,0,0.08);
}
body.dark {
  --bg: #0f0f10;
  --card: #1a1a1a;
  --text: #ffffff;
  --muted: #aaa;
  --primary: #14b8a6;
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
  --border: rgba(255,255,255,0.08);
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  transition: 0.3s ease;
}
.container {
  width: 92%;
  max-width: 560px;
  background: var(--card);
  padding: 42px;
  border-radius: 18px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: fadeIn 0.6s ease;
  border: 1px solid var(--border);
}
h2 { margin-bottom: 8px; font-size: 26px; }
p { color: var(--muted); font-size: 15px; }
button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s ease;
}
.pay-btn { background: var(--primary); color: white; font-weight: 600; font-size: 17px; padding: 18px; }
.pay-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(20,184,166,0.25); }
.toggle-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.switch { position: relative; width: 55px; height: 30px; }
.switch input { display: none; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 30px; transition: 0.3s; }
.slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 4px; bottom: 4px; background: white; border-radius: 50%; transition: 0.3s; }
input:checked + .slider { background: var(--primary); }
input:checked + .slider:before { transform: translateX(25px); }
.status { margin-top: 15px; font-size: 13px; color: var(--muted); min-height: 20px; }
.spinner { width: 42px; height: 42px; margin: 18px auto; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) { .container { padding: 22px; } }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>

<body>

<div class="container">
  <div class="toggle-wrapper">
    <span>Light / Dark</span>
    <label class="switch">
      <input type="checkbox" onchange="toggleTheme(this)">
      <span class="slider"></span>
    </label>
  </div>

  <h2 id="title">Confirming Payment</h2>
  <p id="message">Please wait while we confirm your payment…</p>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="statusText"></p>
  <button class="pay-btn" id="homeBtn" style="display:none;" onclick="window.location.href='index.html'">Back to KasiStay</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

function toggleTheme(el) { document.body.classList.toggle("dark", el.checked); }
window.toggleTheme = toggleTheme;

const firebaseConfig = {
  apiKey: "AIzaSyD_MtScfT0J5b8LbMm5oAATmw84plKWl-0",
  authDomain: "kasistay-3b79c.firebaseapp.com",
  projectId: "kasistay-3b79c",
  storageBucket: "kasistay-3b79c.appspot.com",
  messagingSenderId: "19156366595",
  appId: "1:19156366595:web:c64b9bd6dfde5790e02536",
  databaseURL: "https://kasistay-3b79c-default-rtdb.firebaseio.com"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

// The payment reference is provided by the server-side checkout (Yoco return URL).
const params = new URLSearchParams(window.location.search);
const paymentRef = params.get("ref") || params.get("paymentId") || "";

const titleEl  = document.getElementById("title");
const msgEl    = document.getElementById("message");
const statusEl = document.getElementById("statusText");
const spinner  = document.getElementById("spinner");
const homeBtn  = document.getElementById("homeBtn");

function finish(ok, text) {
  spinner.style.display = "none";
  homeBtn.style.display = "block";
  titleEl.textContent = ok ? "Payment Successful" : "Payment Not Completed";
  msgEl.textContent   = text;
}

if (!paymentRef) {
  finish(false, "No payment reference was found. If you were charged, please contact support.");
} else {
  statusEl.textContent = "Waiting for payment confirmation…";
  // Wait for auth to be restored so the owner can read their own session.
  onAuthStateChanged(auth, user => {
    if (!user) {
      finish(false, "Please sign in to view your payment status.");
      return;
    }
    // The listing is published ONLY by the verified server-side webhook.
    // This page merely reflects the server-written status.
    const statusRef = ref(db, `paymentSessions/${paymentRef}/status`);
    let settled = false;
    onValue(statusRef, snap => {
      const status = snap.val();
      if (status === "paid") {
        settled = true;
        finish(true, "Your listing has been published. It will appear once approved.");
      } else if (status === "failed" || status === "cancelled") {
        settled = true;
        finish(false, "The payment was not completed. You can try again from the app.");
      }
    }, () => {
      finish(false, "We could not read the payment status. Please try again later.");
    });

    // Timeout fallback so the page never spins forever.
    setTimeout(() => {
      if (!settled) finish(false, "We are still waiting for confirmation. Check back shortly or contact support.");
    }, 60000);
  });
}
</script>

</body>
</html>
